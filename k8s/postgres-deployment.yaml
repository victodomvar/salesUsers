apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesusers-postgres
  namespace: deibidsales
  labels:
    app.kubernetes.io/name: salesusers-postgres
    app.kubernetes.io/part-of: salesusers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: salesusers-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salesusers-postgres
        app.kubernetes.io/part-of: salesusers
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: salesusers-db-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6

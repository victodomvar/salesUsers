apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesusers
  namespace: deibidsales
  labels:
    app.kubernetes.io/name: salesusers
    app.kubernetes.io/part-of: salesusers
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: salesusers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salesusers
        app.kubernetes.io/part-of: salesusers
    spec:
      containers:
        - name: salesusers
          image: victodomvar/salesusers:develop-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: salesusers-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
